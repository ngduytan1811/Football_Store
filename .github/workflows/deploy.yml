name: Deploy Football Store to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: "8.0.x"

    - name: Publish project
      run: dotnet publish **/FBS.Internal.csproj -c Release -o publish /p:ExcludeFiles=appsettings*.json

    - name: Compress publish folder
      run: tar -czf publish.tar.gz -C publish .

    - name: Upload to VPS via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT }}
        source: "publish.tar.gz"
        target: "/var/www/football_store"

    - name: SSH to VPS and deploy
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          cd /var/www/football_store
          tar -xzf publish.tar.gz
          rm publish.tar.gz

          sudo systemctl restart football_store

          echo "🚀 Deploy Football Store Successful!"
